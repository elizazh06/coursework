model:
  _target_: models.mixture_of_mamba_ref_avs.MixtureOfMambaRefAVSModel

  d_model: 768
  n_layers: 4
  # Match mamba-130m-hf for HF weight transfer
  d_state: 16
  conv_kernel: 4
  expand: 2
  ff_mult: 4
  num_experts: 4
  top_k: 2
  dropout: 0.1

  # Ref-AVS pre-extracted feature dims (see datasets/ref_avs.py)
  audio_dim: 128
  text_dim: 768
  max_text_tokens: 25

  # Must match dataset.params.mask_size / image_size
  mask_size: 256
  image_size: 256

  use_official_mamba_ssm: true
  hf_pretrained_mamba_model: state-spaces/mamba-130m-hf
  pretrained_mamba_path: null
  pretrained_mamba_prefix: ""
  freeze_mamba: false
