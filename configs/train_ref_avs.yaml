defaults:
  - dataset: ref_avs
  - model: ref_avs_baseline
  - _self_

trainer:
  seed: 42
  device: auto
  n_epochs: 30
  save_dir: checkpoints
  save_period: 1
  monitor: "max val_mean_iou"
  early_stop: 8
  max_grad_norm: 1.0
  skip_oom: true
  save_last: true
  # frames, audio_feat, text_feat, masks must be moved to GPU
  device_tensors: ["frames", "audio_feat", "text_feat", "masks"]
  resume_from: null
  from_pretrained: null
  epoch_len: null
  log_step: 20

writer:
  _target_: writer.simple_writer.SimpleWriter
  run_name: ref_avs_train
  log_checkpoints: false
  loss_names: ["loss", "bce_loss", "dice_loss"]

loss_function:
  _target_: losses.segmentation.SegmentationLoss
  bce_weight: 1.0
  dice_weight: 1.0
  # Uncomment and tune pos_weight if foreground pixels are sparse:
  # pos_weight: 5.0

metrics:
  train:
    - _target_: metrics.segmentation_metrics.MeanIoUMetric
      name: mean_iou
  inference:
    - _target_: metrics.segmentation_metrics.MeanIoUMetric
      name: mean_iou
    - _target_: metrics.segmentation_metrics.BoundaryFMetric
      name: boundary_f
    - _target_: metrics.segmentation_metrics.JAndFMetric
      name: j_and_f

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-4
  weight_decay: 1.0e-4

lr_scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  T_max: 30
  eta_min: 1.0e-6
