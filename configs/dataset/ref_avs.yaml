# ──────────────────────────────────────────────────────────────────────────
# Ref-AVS-Bench dataset profile.
#
# Actual dataset layout (elizazh/ref-avs-bench-unpacked on Kaggle):
#   <data_root>/metadata.csv              — vid, uid, fid, exp, split
#   <data_root>/media/<vid>/audio.wav
#   <data_root>/media/<vid>/frames/{0..9}.jpg
#   <data_root>/gt_mask/<vid>/fid_<fid>/0000{0..9}.png
#
# Usage:
#   python train.py     dataset=ref_avs model=ref_avs_baseline
#   python inference.py dataset=ref_avs model=ref_avs_baseline \
#       inferencer.from_pretrained=checkpoints/ref_avs_baseline/model_best.pth
# ──────────────────────────────────────────────────────────────────────────

dataset:
  module: ref_avs
  name: RefAVSDataset
  batch_size: 1          # 1 sample = 10 frames through Swin-Base; keep at 1
  eval_batch_size: 1
  num_workers: 0         # 0 recommended: text encoder lives in __init__
  timeout: 0             # must be 0 when num_workers=0
  pin_memory: false
  params:
    # Path to the unpacked dataset on Kaggle.
    # Override at runtime:
    #   dataset.params.data_root=/kaggle/input/ref-avs-bench-unpacked
    data_root: /kaggle/input/ref-avs-bench-unpacked

    frame_n: 10           # frames per clip (fixed in original code)
    mask_size: 256        # GT and output mask resolution H = W
    image_size: 256       # frame resize fed to backbone

    sample_rate: 16000    # audio resampling target

    # Text model — same as official code (distilbert/distilroberta-base)
    text_model: distilbert/distilroberta-base
    text_max_len: 25

# ── Trainer overrides (segmentation task, not classification) ─────────────
trainer:
  n_epochs: 30
  monitor: "max val_mean_iou"
  early_stop: 8
  log_step: 20
  device_tensors: ["frames", "audio_feat", "text_feat", "masks"]

# ── Inferencer overrides ───────────────────────────────────────────────────
inferencer:
  device_tensors: ["frames", "audio_feat", "text_feat", "masks"]
  save_path: ref_avs_inference
  from_pretrained: checkpoints/ref_avs_baseline/model_best.pth
  metrics_filename: test_metrics.json

# ── Loss (BCE + Dice instead of cross-entropy) ────────────────────────────
loss_function:
  _target_: losses.segmentation.SegmentationLoss
  bce_weight: 1.0
  dice_weight: 1.0

# ── Metrics ───────────────────────────────────────────────────────────────
metrics:
  train:
    - _target_: metrics.segmentation_metrics.MeanIoUMetric
      name: mean_iou
  inference:
    - _target_: metrics.segmentation_metrics.MeanIoUMetric
      name: mean_iou
    - _target_: metrics.segmentation_metrics.BoundaryFMetric
      name: boundary_f
    - _target_: metrics.segmentation_metrics.JAndFMetric
      name: j_and_f

# ── Optimizer / scheduler ─────────────────────────────────────────────────
optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-4
  weight_decay: 1.0e-4

lr_scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  T_max: 30
  eta_min: 1.0e-6

# ── Writer ────────────────────────────────────────────────────────────────
writer:
  run_name: ref_avs_train
  loss_names: ["loss", "bce_loss", "dice_loss"]
