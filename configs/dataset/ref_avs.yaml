# Ref-AVS-Bench layout:
#   <data_root>/metadata.csv
#   <data_root>/media/<vid>/audio.wav
#   <data_root>/media/<vid>/frames/{0..9}.jpg
#   <data_root>/gt_mask/<vid>/fid_<fid>/{00000..00009}.png
#
# Relative data_root is resolved in order: cwd, project dir, parent of project dir.
# Example: repo at ~/coursework, dataset at ~/REFAVS → data_root=REFAVS works.

dataset:
  module: ref_avs
  name: RefAVSDataset
  # Full-training defaults. For a quick smoke/tiny-overfit run, override these
  # from CLI instead of editing the file, e.g. dataset.params.limit=4.
  batch_size: 8
  eval_batch_size: 8
  num_workers: 8
  prefetch_factor: 4
  persistent_workers: true
  timeout: 0
  pin_memory: true
  params:
    data_root: REFAVS
    frame_n: 10
    mask_size: 256
    image_size: 256
    sample_rate: 16000
    text_model: distilbert/distilroberta-base
    text_max_len: 25
    use_cache: true
    cache_root: null
    rebuild_cache: false
    limit: null
    shuffle_index: false

trainer:
  n_epochs: 80
  monitor: "max val_mean_iou"
  monitor_min_delta: 1.0e-5
  early_stop: 12
  log_step: 50
  eval_every: 2
  eval_parts: ["val"]
  grad_norm_every: 100
  use_amp: true
  amp_dtype: bf16
  device_tensors: ["frames", "audio_feat", "text_feat", "masks"]
  log_keys:
    - loss
    - bce_loss
    - dice_loss
    - mean_iou
    - soft_mean_iou
    - pred_pos_rate
    - target_pos_rate
    - logit_mean
    - logit_std
    - val_loss
    - val_bce_loss
    - val_dice_loss
    - val_mean_iou
    - val_soft_mean_iou
    - val_pred_pos_rate
    - val_target_pos_rate
    - val_logit_mean
    - val_logit_std

inferencer:
  device_tensors: ["frames", "audio_feat", "text_feat", "masks"]
  save_path: ref_avs_inference
  from_pretrained: checkpoints/ref_avs_baseline/model_best.pth
  metrics_filename: test_metrics.json

loss_function:
  _target_: losses.segmentation.SegmentationLoss
  bce_weight: 1.0
  dice_weight: 1.0
  pos_weight: auto
  pos_weight_max: 50.0

metrics:
  train:
    - _target_: metrics.segmentation_metrics.MeanIoUMetric
      name: mean_iou
    - _target_: metrics.segmentation_metrics.SoftMeanIoUMetric
      name: soft_mean_iou
    - _target_: metrics.segmentation_metrics.PredPositiveRateMetric
      name: pred_pos_rate
    - _target_: metrics.segmentation_metrics.TargetPositiveRateMetric
      name: target_pos_rate
    - _target_: metrics.segmentation_metrics.LogitMeanMetric
      name: logit_mean
    - _target_: metrics.segmentation_metrics.LogitStdMetric
      name: logit_std
  val:
    - _target_: metrics.segmentation_metrics.MeanIoUMetric
      name: mean_iou
    - _target_: metrics.segmentation_metrics.SoftMeanIoUMetric
      name: soft_mean_iou
    - _target_: metrics.segmentation_metrics.PredPositiveRateMetric
      name: pred_pos_rate
    - _target_: metrics.segmentation_metrics.TargetPositiveRateMetric
      name: target_pos_rate
    - _target_: metrics.segmentation_metrics.LogitMeanMetric
      name: logit_mean
    - _target_: metrics.segmentation_metrics.LogitStdMetric
      name: logit_std
  inference:
    - _target_: metrics.segmentation_metrics.MeanIoUMetric
      name: mean_iou
    - _target_: metrics.segmentation_metrics.BoundaryFMetric
      name: boundary_f
    - _target_: metrics.segmentation_metrics.JAndFMetric
      name: j_and_f

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-4
  weight_decay: 1.0e-4

lr_scheduler:
  _target_: utils.lr_scheduler.WarmupCosineLR
  max_epochs: 80
  warmup_epochs: 5
  min_lr: 1.0e-6
  warmup_start_factor: 0.2

writer:
  run_name: ref_avs_train
  loss_names: ["loss", "bce_loss", "dice_loss"]
