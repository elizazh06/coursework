# Ref-AVS-Bench layout:
#   <data_root>/metadata.csv
#   <data_root>/media/<vid>/audio.wav
#   <data_root>/media/<vid>/frames/{0..9}.jpg
#   <data_root>/gt_mask/<vid>/fid_<fid>/{00000..00009}.png
#
# Relative data_root is resolved in order: cwd, project dir, parent of project dir.
# Example: repo at ~/coursework, dataset at ~/REFAVS → data_root=REFAVS works.

dataset:
  module: ref_avs
  name: RefAVSDataset
  batch_size: 1
  eval_batch_size: 1
  num_workers: 4
  prefetch_factor: 4
  persistent_workers: true
  timeout: 0
  pin_memory: true
  params:
    data_root: REFAVS
    frame_n: 10
    mask_size: 256
    image_size: 256
    sample_rate: 16000
    text_model: distilbert/distilroberta-base
    text_max_len: 25
    use_cache: true
    cache_root: null
    rebuild_cache: false

trainer:
  n_epochs: 30
  monitor: "max val_mean_iou"
  early_stop: 8
  log_step: 20
  eval_every: 2
  eval_parts: ["val"]
  grad_norm_every: 100
  use_amp: true
  amp_dtype: fp16
  device_tensors: ["frames", "audio_feat", "text_feat", "masks"]

inferencer:
  device_tensors: ["frames", "audio_feat", "text_feat", "masks"]
  save_path: ref_avs_inference
  from_pretrained: checkpoints/ref_avs_baseline/model_best.pth
  metrics_filename: test_metrics.json

loss_function:
  _target_: losses.segmentation.SegmentationLoss
  bce_weight: 1.0
  dice_weight: 1.0

metrics:
  train:
    - _target_: metrics.segmentation_metrics.MeanIoUMetric
      name: mean_iou
  inference:
    - _target_: metrics.segmentation_metrics.MeanIoUMetric
      name: mean_iou
    - _target_: metrics.segmentation_metrics.BoundaryFMetric
      name: boundary_f
    - _target_: metrics.segmentation_metrics.JAndFMetric
      name: j_and_f

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-4
  weight_decay: 1.0e-4

lr_scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  T_max: 30
  eta_min: 1.0e-6

writer:
  run_name: ref_avs_train
  loss_names: ["loss", "bce_loss", "dice_loss"]
